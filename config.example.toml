# Copy to config.toml and edit. Relative paths resolve against the directory holding config.toml.

github_login = "your-github-login"
# Only PRs in these repos are considered. Empty lists are rejected.
# An entry is either "owner/name" or a table with extra review instructions, one sentence each.
# Built-in lenses default to ["sre"]; set lenses = [] on a table entry to turn them off.
repos = [
    "owner/name",
    { name = "owner/other", context = ["prod-logs"], instructions = [
        "Every new API endpoint needs an authorization test.",
        "Database migrations must be backwards compatible with the previous release.",
    ] },
]

include_team_requests = true   # false: only direct review requests (user-review-requested)
skip_drafts = true
interval_minutes = 5           # launchd StartInterval; minimum 2
debounce_minutes = 5           # wait this long after a new head SHA is first seen
concurrency = 2
existing_pending_policy = "skip"   # "skip" or "replace" (replace only deletes pending reviews with our marker)
rereview_on_push = true        # false: review each PR once, ignore later pushes
max_attempts = 3               # failed reviews are retried up to this many times
# PRs by these GitHub logins are reviewed only after you approve each head SHA.
# The cycle sends a clickable "Approve review?" notification; `review <url>` bypasses this.
approval_required_authors = []
# At most this many automatic reviews per author in any rolling 24 hours. Extra PRs are
# marked throttled and reviewed once the window frees up. Keys are GitHub logins.
daily_review_limits = {}       # e.g. { some-login = 10 }
related_max_age_hours = 12     # refresh a shared related-repo checkout once older than this
related_guide_max_bytes = 20000  # cap on each related repo's AGENTS.md/CLAUDE.md/README.md
sensitive_paths = [
    "**/migrations/**",
    "**/auth/**",
    "**/*secret*",
]

[reviewer]
backend = "claude_cli"
model = "opus"
effort = "medium"
timeout_s = 600
max_inline_comments = 10
max_diff_bytes = 200000

[guidance]
extra_paths = []
max_file_bytes = 100000
max_total_bytes = 500000

[guidance_watch]
# Defaults shown; override only to change what counts as review or agent configuration.
review_guidance = [
    ".claude/skills/**",
    ".claude/commands/**",
    ".claude/agents/**",
    "**/AGENTS.md",
    "**/CLAUDE.md",
    "**/CLAUDE.local.md",
    "CONTRIBUTING*",
    "REVIEWING*",
    "docs/**/*review*",
    ".github/PULL_REQUEST_TEMPLATE*",
    ".github/copilot-instructions.md",
    ".cursor/rules/**",
    "CODEOWNERS",
    ".github/CODEOWNERS",
]
agent_execution_config = [
    ".claude/settings*.json",
    ".claude/hooks/**",
    ".mcp.json",
    "**/.mcp.json",
    ".claude/**/*.sh",
    ".gitattributes",
    ".gitmodules",
    ".lfsconfig",
    ".githooks/**",
    ".envrc",
]

[feedback]
# Notify about new reviews and comments from others on your own open PRs in `repos`.
# Feedback from before the first run is treated as already seen.
enabled = true
ignore_authors = []            # e.g. ["Copilot", "copilot-pull-request-reviewer[bot]"]
quiet_minutes = 5              # notify once a PR has had no new feedback for this long
max_wait_minutes = 30          # but never hold feedback longer than this

[notifier]
backend = "terminal_notifier"  # or "osascript" (no click-through, logs the URL)

[paths]
var_dir = "var"

# Checks run once per cycle for repos whose context needs them. A failing check sends one
# notification with the hint, and those reviews wait until a later cycle's check passes.
# With login set, clicking the notification runs it in a new terminal window.
[[auth]]
name = "gcloud"
check = ["gcloud", "auth", "print-access-token", "--quiet"]
hint = "Run gcloud auth login, then finish sign-in in the browser"
login = ["gcloud", "auth", "login"]

# Related repos: each review of a group member gets read-only checkouts of the other members
# and the diffs of PRs in them that the PR body references (owner/repo#N or a PR URL).
# Every group member needs a repo_info description; members need not be in `repos`.

[repo_info."owner/name"]
description = "What lives in this repo, in one line."

[repo_info."owner/other"]
description = "What lives in this repo, in one line."

[[related]]
repos = ["owner/name", "owner/other"]

# Context sources: gcloud_logs, aws_logs, mysql_schema, hoop_schema. See README.
[context.prod-logs]
kind = "gcloud_logs"
auth = "gcloud"
project = "my-prod-project"
filter = "severity>=ERROR"
freshness = "24h"
limit = 200
